name: behaviour-emulator

# Behaviour scenarios against a GitHub emulator inside this one job: no
# repository secrets, no environment, no OIDC to a real cloud. Every
# credential (emulator admin token, App keys, mint) is made for the run.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      # No defaults: an empty input falls back to the shards and DEFAULT_*.
      features:
        description: Space-separated feature paths under e2e/behaviour (empty runs the shards and playback)
      workers:
        description: Scenarios in parallel (slot pool size and godog concurrency; empty uses DEFAULT_WORKERS)
      runners:
        description: Real actions/runner processes on the emulator (empty uses DEFAULT_RUNNERS)

permissions:
  contents: read

concurrency:
  group: behaviour-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The emulator-ready set (43 scenarios plus the 16 bot identity ones) in
  # four shards, each on its own VM at six workers, balanced on measured
  # scenario time (about 5600-6100 worker-seconds each, so about 17
  # minutes of suite per shard). A 4-vCPU VM averages 60-66% CPU at six
  # workers, so shards scale out, not up.
  #
  # Shard e: mint-scope.feature (18 outline rows, about 10 minutes of suite).
  #
  # Live only, not here: base-dispatch.feature (both scenarios) and
  # url-dispatch.feature:7. They fetch a harness from raw.githubusercontent.com,
  # which the emulator answers on a private VM address, and fullsend's fetch
  # guard refuses private addresses by design.
  SHARD_A_FEATURES: >-
    features/dispatch/owners-auth.feature features/platform/actor-authorization.feature features/platform/bot-role-lookup.feature features/platform/mint-status.feature
  SHARD_B_FEATURES: >-
    features/triage/triage.feature features/dispatch/dispatch.feature features/dispatch/retro-cel-route.feature features/dispatch/hooks-loaded.feature features/actors/actor-identities.feature features/dispatch/jira-poll-dispatch.feature features/dispatch/jira-transport-bounds.feature
  SHARD_C_FEATURES: >-
    features/dispatch/fork-bash-routing.feature features/dispatch/fix-authorization.feature features/dispatch/fork-dispatch.feature features/dispatch/url-dispatch.feature:29 features/dispatch/url-dispatch.feature:64 features/dispatch/url-dispatch.feature:100 features/dispatch/runner-secret-overlay-guard.feature
  SHARD_D_FEATURES: >-
    features/platform/bot-actor-authorization.feature features/dispatch/triage-prioritize-cel-route.feature features/dispatch/review-cel-route.feature features/dispatch/reaction-notifications.feature
  SHARD_E_FEATURES: >-
    features/platform/mint-scope.feature
  DEFAULT_CAPABILITIES: runner-secret-overlay-guard
  DEFAULT_WORKERS: "6"
  DEFAULT_RUNNERS: "12"
  # waynesun09/github-emulator ci-self-contained (integration head with the mint App seed).
  EMULATOR_REPO: waynesun09/github-emulator
  EMULATOR_REF: f016e9e690d33adbfe41131776f5097f65dec2d0

jobs:
  behaviour-emulator:
    name: behaviour-emulator (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # A dispatch with explicit features runs them as one "custom" shard.
        shard: ${{ fromJSON(inputs.features && '["custom"]' || '["a","b","c","d","e"]') }}
    steps:
      - name: Checkout fullsend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout github-emulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.EMULATOR_REPO }}
          ref: ${{ env.EMULATOR_REF }}
          path: .emulator
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install emulator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/emu-venv"
          "$RUNNER_TEMP/emu-venv/bin/pip" install -q -r .emulator/requirements.txt

      - name: Run behaviour features
        env:
          EMULATOR_DIR: ${{ github.workspace }}/.emulator
          EMULATOR_PY: ${{ runner.temp }}/emu-venv/bin/python
          STATE_DIR: ${{ runner.temp }}/bt-emulator
          # Read-only job token, only so the emulator can fetch public
          # github.com actions without the anonymous rate limit.
          UPSTREAM_TOKEN: ${{ github.token }}
          FEATURES: ${{ inputs.features || (matrix.shard == 'a' && env.SHARD_A_FEATURES) || (matrix.shard == 'b' && env.SHARD_B_FEATURES) || (matrix.shard == 'c' && env.SHARD_C_FEATURES) || (matrix.shard == 'd' && env.SHARD_D_FEATURES) || env.SHARD_E_FEATURES }}
          WORKERS: ${{ inputs.workers || env.DEFAULT_WORKERS }}
          EMULATOR_RUNNERS: ${{ inputs.runners || env.DEFAULT_RUNNERS }}
          SUITE_TIMEOUT: 30m
          BEHAVIOUR_CAPABILITIES: ${{ env.DEFAULT_CAPABILITIES }}
          # The run falls back to fullsend-ai/agents@main on the configured forge.
          AGENTS_SEED: "1"
        run: |
          read -ra feats <<<"$FEATURES"
          export BEHAVIOUR_POOL_SIZE="$WORKERS" GODOG_CONCURRENCY="$WORKERS"
          e2e/behaviour/emulator/run-job.sh "${feats[@]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behaviour-emulator-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/bt-emulator/**/*.log
            ${{ runner.temp }}/bt-emulator/phases.tsv
            ${{ runner.temp }}/bt-emulator/emulator-profile.json
            ${{ runner.temp }}/bt-emulator/bt-artifacts/
            !${{ runner.temp }}/bt-emulator/stack/runner-*/_work/**
          if-no-files-found: warn

  # The playback suite (-tags playback) on its own VM and stack, in parallel
  # with the shards, so it adds no wall time. A dispatch with explicit
  # features skips it.
  behaviour-emulator-playback:
    name: behaviour-emulator (playback)
    if: ${{ !inputs.features }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fullsend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout github-emulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.EMULATOR_REPO }}
          ref: ${{ env.EMULATOR_REF }}
          path: .emulator
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install emulator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/emu-venv"
          "$RUNNER_TEMP/emu-venv/bin/pip" install -q -r .emulator/requirements.txt

      - name: Run the playback suite
        env:
          EMULATOR_DIR: ${{ github.workspace }}/.emulator
          EMULATOR_PY: ${{ runner.temp }}/emu-venv/bin/python
          STATE_DIR: ${{ runner.temp }}/bt-emulator
          # Read-only job token, only so the emulator can fetch public
          # github.com actions without the anonymous rate limit.
          UPSTREAM_TOKEN: ${{ github.token }}
          BT_SUITE: playback
          # The code stage opens its pull request and then labels it
          # ready-for-review: two review dispatches, of which the review
          # job's cancel-in-progress group keeps one only if they overlap,
          # as they do on GitHub-hosted runners. Four runners make them
          # overlap here too.
          EMULATOR_RUNNERS: "4"
        run: e2e/behaviour/emulator/run-job.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behaviour-emulator-logs-playback
          path: |
            ${{ runner.temp }}/bt-emulator/**/*.log
            ${{ runner.temp }}/bt-emulator/phases.tsv
            ${{ runner.temp }}/bt-emulator/bt-artifacts/
            !${{ runner.temp }}/bt-emulator/stack/runner-*/_work/**
          if-no-files-found: warn
