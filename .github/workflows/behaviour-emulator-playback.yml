name: behaviour-emulator-playback

# The playback behaviour suite against a GitHub emulator inside this one job,
# next to behaviour-emulator: no repository secrets, no environment, no OIDC
# to a real cloud. Every credential (emulator admin token, App keys, mint) is
# made for the run. A separate job with its own stack, because the playback
# suite is its own test binary (-tags playback) and its five-stage scenario
# is the longest; in parallel it adds no wall time.

on:
  pull_request:
  push:
    branches: [bt-emulator-playback]
  workflow_dispatch:
    inputs:
      agents_prs:
        description: fullsend-ai/agents pull requests merged into the seeded agents (space-separated)
        default: "1871 1873 2034"

permissions:
  contents: read

concurrency:
  group: behaviour-emulator-playback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # waynesun09/github-emulator ci-self-contained, the integration ref: the CI
  # stack, the emulator fixes fullsend's suites need, the mint App seed, the
  # OIDC claims, the *.localhost resolver and GH_HOST on the real runner.
  # Also runner job cancellation and GraphQL Bot authors (fix eligibility).
  EMULATOR_REPO: waynesun09/github-emulator
  EMULATOR_REF: 2f24c77beaf97c43ac582e3cf73e32b21a8d7506

jobs:
  behaviour-emulator-playback:
    name: behaviour-emulator-playback
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fullsend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout github-emulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.EMULATOR_REPO }}
          ref: ${{ env.EMULATOR_REF }}
          path: .emulator
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install emulator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/emu-venv"
          "$RUNNER_TEMP/emu-venv/bin/pip" install -q -r .emulator/requirements.txt

      - name: Run the playback suite
        env:
          EMULATOR_DIR: ${{ github.workspace }}/.emulator
          EMULATOR_PY: ${{ runner.temp }}/emu-venv/bin/python
          STATE_DIR: ${{ runner.temp }}/bt-emulator
          # Read-only job token, only so the emulator can fetch public
          # github.com actions without the anonymous rate limit.
          UPSTREAM_TOKEN: ${{ github.token }}
          BT_SUITE: playback
          # The code stage opens its pull request and then labels it
          # ready-for-review: two review dispatches. The review job's
          # concurrency group (cancel-in-progress) keeps one, but only if the
          # two overlap, as they do on GitHub-hosted runners. With two
          # emulator runners the second waited for a runner, the first
          # finished, and both reviews ran (the second served the fix entry).
          EMULATOR_RUNNERS: "4"
          # The host-aware agents ops scripts and the pre-review clone host
          # (agents#2034), until they merge.
          AGENTS_PRS: ${{ inputs.agents_prs || '1871 1873 2034' }}
        run: e2e/behaviour/emulator/run-job.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behaviour-emulator-playback-logs
          path: |
            ${{ runner.temp }}/bt-emulator/**/*.log
            ${{ runner.temp }}/bt-emulator/phases.tsv
            ${{ runner.temp }}/bt-emulator/bt-artifacts/
          if-no-files-found: warn
