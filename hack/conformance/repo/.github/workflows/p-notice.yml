name: p-notice
# Workflow commands as they appear in the job log and as annotations.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::conf plain notice"
          echo "::notice title=ConfTitle::conf titled notice"
          echo "::warning::conf warning"
