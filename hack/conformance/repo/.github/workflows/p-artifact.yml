name: p-artifact
# One small v4 artifact, as seen afterwards through the REST API.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: printf 'conformance\n' > conf.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conf-artifact
          path: conf.txt
